<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Paiements directs à transmettre</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>

<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold text-gradient-blue">
                <i class="fas fa-paper-plane me-2 icon-gradient-blue"></i> Paiements directs à transmettre
            </h1>
            <div>
                <a th:href="@{/demande/list}" class="btn btn-outline-secondary">
                    <i class="fas fa-list-ul me-1"></i> Liste des demandes
                </a>
            </div>
        </div>

<!--        <div class="alert alert-info shadow-sm mb-3">-->
<!--            <i class="fas fa-info-circle me-2"></i> Vue Moyens Généraux : demandes en paiement direct à transmettre ou transmises à la finance.-->
<!--        </div>-->

        <!-- CARD FILTRES -->
        <div class="card shadow-lg border-0 mb-3">
            <div class="card-body">

                <form method="get" th:action="@{/demande/paiements-directs}" class="row g-2 align-items-end">
                    <input type="hidden" name="sort" th:value="${sort}">
                    <input type="hidden" name="dir" th:value="${dir}">

                    <!-- N° demande -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">N° demande</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                            <input class="form-control" type="text" name="num"
                                   th:value="${num}" placeholder="DM..." />
                        </div>
                    </div>

                    <!-- Demandeur -->
                    <div class="col-md-3">
                        <label class="form-label mb-1">Demandeur</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="far fa-user"></i></span>
                            <input class="form-control" type="text" name="demandeur"
                                   th:value="${demandeur}" placeholder="Nom / Prénom ..." />
                        </div>
                    </div>

                    <!-- Motif évoqué -->
                    <div class="col-md-3">
                        <label class="form-label mb-1">Motif évoqué</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-comment-alt"></i></span>
                            <input class="form-control" type="text" name="motif"
                                   th:value="${motif}" placeholder="Motif..." />
                        </div>
                    </div>

                    <!-- Type -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">Type</label>
                        <select class="form-select" name="type">
                            <option value="" th:selected="${type == null || type == ''}">Tous</option>
                            <option value="OPEX" th:selected="${type == 'OPEX'}">OPEX</option>
                            <option value="CAPEX" th:selected="${type == 'CAPEX'}">CAPEX</option>
                        </select>
                    </div>

                    <!-- Statut Transmission Finance -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">Statut transmission</label>
                        <select class="form-select" name="statutTransmission">
                            <option value="" th:selected="${statutTransmission == null || statutTransmission == ''}">Tous</option>
                            <th:block th:if="${transmissionFiltre != null}">
                                <option th:each="entry : ${transmissionFiltre.entrySet()}"
                                        th:value="${entry.key}"
                                        th:text="${entry.value}"
                                        th:selected="${statutTransmission != null && statutTransmission == entry.key}">
                                </option>
                            </th:block>
                        </select>
                    </div>

                    <!-- Priorité -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">Priorité</label>
                        <select class="form-select" name="priorite">
                            <option value="" th:selected="${priorite == null || priorite == ''}">Toutes</option>
                            <th:block th:if="${prioriteFiltre != null}">
                                <option th:each="entry : ${prioriteFiltre.entrySet()}"
                                        th:value="${entry.key}"
                                        th:text="${entry.value}"
                                        th:selected="${priorite != null && priorite == entry.key}">
                                </option>
                            </th:block>
                        </select>
                    </div>

                    <!-- Taille page -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">
                            <i class="fas fa-list-ol me-1"></i> Taille
                        </label>
                        <select class="form-select" name="size">
                            <option th:value="10" th:selected="${size == 10}">10</option>
                            <option th:value="25" th:selected="${size == 25}">25</option>
                            <option th:value="50" th:selected="${size == 50}">50</option>
                            <option th:value="100" th:selected="${size == 100}">100</option>
                        </select>
                    </div>

                    <!-- Date début -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">Date début</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="far fa-calendar"></i></span>
                            <input class="form-control" type="date" name="dateFrom" th:value="${dateFrom}">
                        </div>
                    </div>

                    <!-- Date fin -->
                    <div class="col-md-2">
                        <label class="form-label mb-1">Date fin</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="far fa-calendar-check"></i></span>
                            <input class="form-control" type="date" name="dateTo" th:value="${dateTo}">
                        </div>
                    </div>

                    <!-- Boutons -->
                    <div class="col-md-12 d-flex gap-2 mt-2">
                        <button class="btn btn-gradient-blue" type="submit" title="Filtrer">
                            <i class="fas fa-filter me-1"></i>Filtrer
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/demande/paiements-directs}" title="Réinitialiser">
                            Réinitialiser
                        </a>
                    </div>
                </form>

            </div>
        </div>

        <!-- CARD TABLEAU -->
        <div class="card shadow-lg border-0">
            <div class="card-body">

                <!-- Total -->
                <div class="text-end text-muted small mb-2">
                    <span th:text="${demandesMeres.totalElements}"></span> ligne(s)
                </div>

                <!-- Tableau -->
                <div class="table-responsive">
                    <table id="demandeTable" class="table table-striped table-hover table-bordered dt-head-gradient">
                        <thead>
                        <tr>
                            <!-- Tri ID -->
                            <th>
                                <a class="text-decoration-none text-dark"
                                   th:href="@{/demande/paiements-directs(page=0,size=${size},
                                    num=${num},demandeur=${demandeur},type=${type},statutTransmission=${statutTransmission},
                                    priorite=${priorite},motif=${motif},dateFrom=${dateFrom},dateTo=${dateTo},
                                    sort='id',dir=${dir=='asc'?'desc':'asc'})}"
                                >
                                    <i class="fas fa-hashtag me-2 icon-gradient-light-blue"></i>
                                    N° de la demande
                                </a>
                            </th>

                            <!-- Tri dateDemande -->
                            <th>
                                <a class="text-decoration-none text-dark"
                                   th:href="@{/demande/paiements-directs(page=0,size=${size},
                                    num=${num},demandeur=${demandeur},type=${type},statutTransmission=${statutTransmission},
                                    priorite=${priorite},motif=${motif},dateFrom=${dateFrom},dateTo=${dateTo},
                                    sort='dateDemande',dir=${dir=='asc'?'desc':'asc'})}"
                                >
                                    <i class="far fa-clock me-2 icon-gradient-light-blue"></i>
                                    Date Demande
                                </a>
                            </th>

                            <th>
                                <i class="far fa-user me-2 icon-gradient-light-blue"></i>Demandeur
                            </th>
                            <th>Motif évoqué</th>
<!--                            <th>Montant estimé</th>-->
                            <th>Priorité</th>
                            <th>Statut finance</th>
<!--                            <th>Actions</th>-->
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="demande : ${demandesMeres.content}"
                            class="clickable-row"
                            th:attr="data-href=@{/demande/fiche/{id}(id=${demande.id}, returnUrl=${returnUrl})}">

                            <td th:text="${demande.id}"></td>
                            <td th:text="${#temporals.format(demande.dateDemande, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <div th:if="${demande.demandeur != null}">
                                    <div class="fw-semibold"
                                         th:text="${demande.demandeur.nom + ' ' + demande.demandeur.prenom}">
                                    </div>
                                    <small class="text-muted"
                                           th:text="${
                                           (demande.demandeur.poste != null ? demande.demandeur.poste.poste : '') +
                                           (demande.demandeur.service != null ? ' - ' + demande.demandeur.service.acronyme : '')
                                       }">
                                    </small>
                                </div>
                                <span th:if="${demande.demandeur == null}">-</span>
                            </td>

                            <td th:text="${#strings.length(demande.motifEvoque) > 50
                            ? #strings.substring(demande.motifEvoque, 0, 50) + '...'
                            : demande.motifEvoque}">
                            </td>

<!--                            <td th:text="${demande.totalEstime != null ? #numbers.formatDecimal(demande.totalEstime, 1, 'WHITESPACE', 2, 'COMMA') : (demande.totalPrix != null ? #numbers.formatDecimal(demande.totalPrix, 1, 'WHITESPACE', 2, 'COMMA') : '-')}"></td>-->

                            <td th:text="${demande.priorite != null ? demande.priorite : '-'}"></td>

                            <td>
                                <span class="badge bg-warning text-dark"
                                      th:if="${demande.statutTransmissionFinance != null and demande.statutTransmissionFinance.name() == 'A_TRANSMETTRE'}">
                                    <i class="fas fa-paper-plane me-1"></i>À transmettre
                                </span>
                                <span class="badge bg-gradient-blue"
                                      th:if="${demande.statutTransmissionFinance != null and demande.statutTransmissionFinance.name() == 'TRANSMISE_FINANCE'}">
                                    <i class="fas fa-check me-1"></i>Transmise à la finance
                                </span>
                                <span class="badge bg-success"
                                      th:if="${demande.statutTransmissionFinance != null and demande.statutTransmissionFinance.name() == 'PAYEE'}">
                                    <i class="fas fa-check-circle me-1"></i>Payée
                                </span>
                            </td>

<!--                            <td>-->
<!--                                <a class="btn btn-sm btn-outline-gradient-blue" th:href="@{/demande/fiche/{id}(id=${demande.id}, returnUrl=${returnUrl})}">-->
<!--                                    Ouvrir-->
<!--                                </a>-->
<!--                            </td>-->
                        </tr>

                        <tr th:if="${demandesMeres.totalElements == 0}">
                            <td colspan="8" class="text-center text-muted py-4">
                                Aucun paiement direct à afficher.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${demandesMeres.totalPages > 1}" class="mt-3" aria-label="Pagination paiements directs">
                    <ul class="pagination justify-content-center mb-0">

                        <!-- Précédente -->
                        <li class="page-item" th:classappend="${demandesMeres.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/demande/paiements-directs(page=${demandesMeres.number - 1}, size=${size},
                                num=${num},demandeur=${demandeur},type=${type},statutTransmission=${statutTransmission},
                                priorite=${priorite},motif=${motif},dateFrom=${dateFrom},dateTo=${dateTo},
                                sort=${sort},dir=${dir})}"
                            >
                                Précédente
                            </a>
                        </li>

                        <!-- Pages autour -->
                        <th:block th:with="
                            start=${T(java.lang.Math).max(0, demandesMeres.number - 2)},
                            end=${T(java.lang.Math).min(demandesMeres.totalPages - 1, demandesMeres.number + 2)}
                        ">
                            <li class="page-item"
                                th:each="p : ${#numbers.sequence(start, end)}"
                                th:classappend="${p == demandesMeres.number} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/demande/paiements-directs(page=${p}, size=${size},
                                    num=${num},demandeur=${demandeur},type=${type},statutTransmission=${statutTransmission},
                                    priorite=${priorite},motif=${motif},dateFrom=${dateFrom},dateTo=${dateTo},
                                    sort=${sort},dir=${dir})}"
                                   th:text="${p + 1}"
                                >
                                </a>
                            </li>
                        </th:block>

                        <!-- Suivante -->
                        <li class="page-item" th:classappend="${demandesMeres.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/demande/paiements-directs(page=${demandesMeres.number + 1}, size=${size},
                                num=${num},demandeur=${demandeur},type=${type},statutTransmission=${statutTransmission},
                                priorite=${priorite},motif=${motif},dateFrom=${dateFrom},dateTo=${dateTo},
                                sort=${sort},dir=${dir})}"
                            >
                                Suivante
                            </a>
                        </li>

                    </ul>

                    <div class="text-center text-muted small mt-2">
                        Page <span th:text="${demandesMeres.number + 1}"></span> /
                        <span th:text="${demandesMeres.totalPages}"></span>
                        — Total: <span th:text="${demandesMeres.totalElements}"></span>
                    </div>
                </nav>

            </div>
        </div>
    </section>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("tr.clickable-row").forEach(row => {
            row.addEventListener("click", (e) => {
                if (e.target.closest("a, button, input, select, textarea, label")) return;

                const href = row.getAttribute("data-href");
                if (!href) return;

                if (e.ctrlKey || e.metaKey) {
                    window.open(href, "_blank");
                } else {
                    window.location.href = href;
                }
            });
        });
    });
    /*]]>*/
</script>

</body>
</html>
