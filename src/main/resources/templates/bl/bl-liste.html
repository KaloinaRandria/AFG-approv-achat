<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Liste des bons de livraison</title>
    <th:block th:insert="~{fragment/load_css :: load_css}"></th:block>
    <th:block th:insert="~{fragment/font :: font}"></th:block>
    <th:block th:insert="~{fragment/load_script :: load_script}"></th:block>
</head>
<body>
<div th:replace="~{fragment/sidebar :: sidebar}"></div>
<div class="main-content">
    <section>
        <div th:replace="~{fragment/load_pop_up :: pop_up}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold text-gradient-blue">
                <i class="fas fa-clipboard-list icon-gradient-blue"></i> Bons de livraison
            </h1>
            <a th:href="@{/bonlivraison/add}" sec:authorize="hasAnyRole('ADMIN','MOYENS_GENERAUX')" class="btn btn-gradient-green">
                <i class="fas fa-plus-circle me-1"></i> Nouveau bon de livraison
            </a>
        </div>

        <!-- Recherche multicritère -->
        <div class="card shadow-lg border-0 mb-3">
            <div class="card-body">
                <form method="get" th:action="@{/bonlivraison/list}" class="row g-2 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fNumero">N° BL / réf.</label>
                        <input class="form-control" type="text" id="fNumero" name="numero" th:value="${numero}"
                               placeholder="BL… ou réf. fournisseur">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fFournisseur">Fournisseur</label>
                        <input class="form-control" type="text" id="fFournisseur" name="fournisseur" th:value="${fournisseur}"
                               placeholder="Nom…">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fBonCommande">Bon de commande</label>
                        <input class="form-control" type="text" id="fBonCommande" name="bonCommande" th:value="${bonCommande}"
                               placeholder="Numéro du BC…">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fArticle">Article</label>
                        <input class="form-control" type="text" id="fArticle" name="article" th:value="${article}"
                               placeholder="Code ou désignation">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fDevise">Devise</label>
                        <select class="form-select" id="fDevise" name="devise">
                            <option value="" th:selected="${devise == ''}">Toutes</option>
                            <option th:each="d : ${devises}" th:value="${d.id}" th:text="${d.acronyme}"
                                    th:selected="${devise == #strings.toString(d.id)}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fOrigine">Origine</label>
                        <select class="form-select" id="fOrigine" name="origine">
                            <option value="" th:selected="${origine == ''}">Toutes</option>
                            <option value="BC" th:selected="${origine == 'BC'}">Réception de bon de commande</option>
                            <option value="HORS_BC" th:selected="${origine == 'HORS_BC'}">Hors bon de commande</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fDu">Reçu du</label>
                        <input class="form-control" type="date" id="fDu" name="dateFrom" th:value="${dateFrom}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1" for="fAu">au</label>
                        <input class="form-control" type="date" id="fAu" name="dateTo" th:value="${dateTo}">
                    </div>
                    <div th:replace="~{fragment/pagination :: taille(${size})}"></div>
                    <div class="col-md-6 d-flex gap-2 align-items-end">
                        <button class="btn btn-gradient-blue" type="submit">
                            <i class="fas fa-filter me-1"></i>Filtrer
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/bonlivraison/list}">Réinitialiser</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-lg border-0">
            <div class="card-body">
                <div class="text-muted small mb-2"
                     th:text="${bons.totalElements} + ' bon(s) de livraison'"></div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Numéro</th>
                            <th>Date de réception</th>
                            <th>Fournisseur</th>
                            <th>Bon de commande</th>
                            <th>Observation</th>
                            <th class="text-end">Montant</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${bons.totalElements == 0}">
                            <td colspan="6" class="text-center text-muted py-4">Aucun bon de livraison.</td>
                        </tr>
                        <tr th:each="bl : ${bons.content}">
                            <td>
                                <a class="fw-semibold text-decoration-none"
                                   th:href="@{/bonlivraison/fiche/{id}(id=${bl.id})}" th:text="${bl.id}"></a>
                            </td>
                            <td th:text="${bl.dateReception != null ? #temporals.format(bl.dateReception, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                            <td th:text="${bl.fournisseur != null ? bl.fournisseur.nom : '—'}"></td>
                            <td>
                                <a th:if="${bl.bonCommandeMere != null}" class="text-decoration-none"
                                   th:href="@{/bon-commande/{id}(id=${bl.bonCommandeMere.id})}"
                                   th:text="${bl.bonCommandeMere.numero != null and !#strings.isEmpty(bl.bonCommandeMere.numero) ? bl.bonCommandeMere.numero : bl.bonCommandeMere.id}"></a>
                                <span th:unless="${bl.bonCommandeMere != null}" class="text-muted">Hors BC</span>
                            </td>
                            <td th:text="${bl.description != null and !#strings.isEmpty(bl.description) ? #strings.abbreviate(bl.description, 50) : '—'}"></td>
                            <td class="text-end"
                                th:text="${bl.totalPrix != null
                                          ? #numbers.formatDecimal(bl.totalPrix, 1, 'WHITESPACE', 2, 'COMMA') + (bl.devise != null ? ' ' + bl.devise.acronyme : '')
                                          : '—'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragment/pagination :: pagination(${bons}, ${urlPagination})}"></div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
